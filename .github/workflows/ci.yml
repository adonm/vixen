name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
          install: true
      - name: Trust repo config
        run: mise trust
      - name: Bootstrap machine
        run: mise bootstrap --yes
      - name: Build
        run: mise exec -- just build
      - name: Gates
        run: mise exec -- just test
