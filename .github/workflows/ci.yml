name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl python3 pkg-config \
            libcurl4-openssl-dev libpsl-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libegl-dev \
            libasound2-dev \
            fonts-noto-core fonts-lohit-deva fonts-thai-tlwg \
            fonts-wqy-microhei fonts-sil-ezra fonts-dejavu-core
      - name: Install just
        run: |
          curl -fsSL -o /tmp/opencode/just.tar.gz https://github.com/casey/just/releases/download/1.58.0/just-1.58.0-x86_64-unknown-linux-musl.tar.gz
          mkdir -p "$HOME/.local/bin" && tar -xzf /tmp/opencode/just.tar.gz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Setup pinned toolchains
        run: just setup
      - name: Build
        run: just build
      - name: Gates
        run: just test
