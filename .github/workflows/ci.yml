name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake curl python3 pkg-config \
            libsdl3-dev libcurl4-openssl-dev libpsl-dev \
            fonts-noto-core fonts-lohit-deva fonts-thai-tlwg \
            fonts-wqy-microhei fonts-sil-ezra fonts-dejavu-core
      - uses: jdx/mise-action@v3
        with:
          install_args: just
      - name: Setup pinned toolchains
        run: just setup
      - name: Build
        run: just build
      - name: Gates
        run: just test
